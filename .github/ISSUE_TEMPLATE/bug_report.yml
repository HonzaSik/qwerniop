name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 150
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Keyboard layout
      options:
        - en-us
        - cs-qwertz
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model server and model
      description: Write "none" if no model server is configured.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
